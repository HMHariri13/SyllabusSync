<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Syllabus - SyllabusSync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* Base Styles (Matching Dashboard) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8; 
            color: #333;
        }

        .app-container {
            max-width: 420px; 
            margin: 0 auto;
            min-height: 100vh;
            background-color: #fff; 
            box-shadow: 0 0 20px rgba(0,0,0,0.05); 
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Header (Consistent with Main Screen) */
        .header {
            background-color: #5bb2ec; 
            position: relative;
            height: 140px; 
            padding: 20px;
            color: white;
            padding-top: 40px; 
        }

        .header-content {
            position: relative;
            z-index: 1; 
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            color: white;
            font-size: 20px;
            text-decoration: none;
        }

        .header-text {
            font-size: 22px;
            font-weight: 700;
        }

        /* Upload Section */
        .content-body {
            padding: 0 25px;
            flex-grow: 1;
            margin-top: -30px;
            z-index: 2;
        }

        .upload-card {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 2px dashed #d1d9e6;
            transition: border-color 0.3s ease;
        }

        .upload-card:hover {
            border-color: #5bb2ec;
        }

        .upload-icon {
            font-size: 50px;
            color: #5bb2ec;
            margin-bottom: 15px;
        }

        .upload-card h4 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #333;
        }

        .upload-card p {
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
        }

        #file-input {
            display: none;
        }

        .select-btn {
            display: inline-block;
            padding: 10px 25px;
            background-color: #f0f4f8;
            color: #007bff;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .select-btn:hover {
            background-color: #e2eaf0;
        }

        /* Requirements List */
        .requirements {
            margin-top: 30px;
        }

        .requirements h5 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
        }

        .req-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            color: #666;
        }

        .req-item i {
            color: #28a745;
            font-size: 16px;
        }

        /* Action Buttons */
        .footer-actions {
            padding: 20px 25px 40px 25px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #4dc0d7 0%, #007bff 100%);
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.2);
            opacity: 0.6; /* Disabled state until file is selected */
            pointer-events: none;
        }

        .submit-btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        .file-preview {
            margin-top: 20px;
            display: none; /* Hidden by default */
            align-items: center;
            background: #fff9e6;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #fce883;
        }

        .file-preview i {
            color: #fadf5e;
            font-size: 20px;
            margin-right: 10px;
        }

        .file-preview span {
            font-size: 14px;
            font-weight: 500;
            color: #5d4900;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-content">
                <a href="#" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
                <div class="header-text">Upload Syllabus</div>
            </div>
        </div>

        <div class="content-body">
            <div class="upload-card" id="drop-zone">
                <div class="upload-icon">
                    <i class="fa-solid fa-file-pdf"></i>
                </div>
                <h4>Select PDF File</h4>
                <p>Drag and drop your syllabus here or browse your device.</p>
                
                <input type="file" id="file-input" accept="application/pdf">
                <label for="file-input" class="select-btn">Browse Files</label>
            </div>

            <div class="file-preview" id="file-preview">
                <i class="fa-solid fa-file-pdf"></i>
                <span id="file-name">syllabus_2024.pdf</span>
                <i class="fa-solid fa-circle-check" style="color: #28a745; margin-left: 10px;"></i>
            </div>

            <div class="requirements">
                <h5>Upload Tips</h5>
                <div class="req-item">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Ensure the file is a readable PDF</span>
                </div>
                <div class="req-item">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Course dates and deadlines should be visible</span>
                </div>
                <div class="req-item">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Max file size: 10MB</span>
                </div>
            </div>
        </div>

        <div class="footer-actions">
            <button class="submit-btn" id="submit-btn">Sync with Calendar</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const filePreview = document.getElementById('file-preview');
        const fileName = document.getElementById('file-name');
        const submitBtn = document.getElementById('submit-btn');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileName.textContent = this.files[0].name;
                filePreview.style.display = 'flex';
                submitBtn.classList.add('active');
            }
        });
        submitBtn.addEventListener('click', async () => {
        const file = fileInput.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append("file", file); // MUST be FILE

        submitBtn.textContent = "Uploading...";
        submitBtn.disabled = true;

        try {
            const response = await fetch(
                "http://127.0.0.1:8000/upload-syllabus/",
                {
                    method: "POST",
                    body: formData
                }
            );

            if (!response.ok) {
                throw new Error("Upload failed");
            }

            const data = await response.json();
            console.log("Backend response:", data);

            alert("Syllabus uploaded and processed successfully!");
        } catch (error) {
            console.error(error);
            alert("Error uploading syllabus");
        } finally {
            submitBtn.textContent = "Sync with Calendar";
            submitBtn.disabled = false;
        }
        });
    </script>
</body>
</html>
