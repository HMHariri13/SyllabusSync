<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Syllabus - SyllabusSync</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="upload-page">
    <div class="app-container">
        <div class="header">
            <div class="header-content">
                <a href="mainScreen.HTML" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
                <div class="header-text">Upload Syllabus</div>
            </div>
        </div>

        <div class="content-body">
            <div class="upload-card" id="drop-zone">
                <div class="upload-icon">
                    <i class="fa-solid fa-file-pdf"></i>
                </div>
                <h4>Select PDF File</h4>
                <p>Drag and drop your syllabus here or browse your device.</p>

                <input type="file" id="file-input" accept="application/pdf">
                <label for="file-input" class="select-btn">Browse Files</label>
            </div>

            <div class="file-preview" id="file-preview">
                <i class="fa-solid fa-file-pdf"></i>
                <span id="file-name">syllabus_2024.pdf</span>
                <i class="fa-solid fa-circle-check file-check"></i>
            </div>

            <div class="requirements">
                <h5>Upload Tips</h5>
                <div class="req-item">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Ensure the file is a readable PDF</span>
                </div>
                <div class="req-item">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Course dates and deadlines should be visible</span>
                </div>
                <div class="req-item">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Max file size: 10MB</span>
                </div>
            </div>
        </div>

        <div class="footer-actions">
            <button class="submit-btn" id="submit-btn">Sync with Calendar</button>
            
            <a href="mainScreen.HTML" class="secondary-btn">Cancel</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
