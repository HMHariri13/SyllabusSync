services:
  mongo:
    image: mongo:7
    container_name: syllasync-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: ./middle-tier-api
    container_name: syllasync-api
    ports:
      - "8001:8000"
    env_file:
      - ./middle-tier-api/app/.env
    depends_on:
      - mongo
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./middle-tier-api:/app

volumes:
  mongo_data: